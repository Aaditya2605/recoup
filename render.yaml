services:
  - type: web
    name: recoup
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    healthCheckPath: /api/state
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: RECOUP_DB
        value: /var/data/recoup.db
      - key: RECOUP_UPLOADS
        value: /var/data/uploads
      - key: PIONEER_API_KEY
        sync: false
      - key: TERAC_API_KEY
        sync: false
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_PRODUCT_ID
        value: pdt_0NlU3YyryA4D3lWXETn3G
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_ENVIRONMENT
        value: test_mode
      - key: DODO_PAYMENTS_RETURN_URL
        sync: false
    disk:
      name: recoup-data
      mountPath: /var/data
      sizeGB: 1
