services:
  - type: web
    name: recoup
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    plan: free
    healthCheckPath: /api/state
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: PIONEER_API_KEY
        sync: false
      - key: TERAC_API_KEY
        sync: false
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_PRODUCT_ID
        value: pdt_0NlU3YyryA4D3lWXETn3G
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PAYMENTS_ENVIRONMENT
        value: test_mode
      - key: DODO_PAYMENTS_RETURN_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: LINQ_API_KEY
        sync: false
      - key: LINQ_FROM_NUMBER
        sync: false
      - key: LINQ_WEBHOOK_SECRET
        sync: false
