services:
  - type: web
    name: recoup
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    healthCheckPath: /api/state
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: RECOUP_DB
        value: /var/data/recoup.db
      - key: RECOUP_UPLOADS
        value: /var/data/uploads
      - key: PIONEER_API_KEY
        sync: false
      - key: TERAC_API_KEY
        sync: false
      - key: STRIPE_PAYMENT_LINK
        sync: false
    disk:
      name: recoup-data
      mountPath: /var/data
      sizeGB: 1
